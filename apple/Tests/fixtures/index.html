<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>iPad 受控验收</title></head><body style="background:#101218;color:white;font:22px system-ui;padding:32px">
<h1>受控 Emby 页面夹具</h1><p id="status">等待原生桥接</p><button id="play" style="font:inherit;padding:20px" onclick="playback()">验证播放循环</button><button style="font:inherit;padding:20px" onclick="download()">验证离线下载</button><button style="font:inherit;padding:20px" onclick="window.tigerestOpenOfflineLibrary()">打开离线媒体</button><a href="http://localhost:18768/foreign.html">外站跳转</a>
<script>
let api;const status=document.querySelector('#status');
(async()=>{try{api=await window.apiPromise;if(!window.tigerestIPadApi||jmpInfo.platform!=='ipad')throw Error('missing platform');await api.settings.setValue('video','cache',150);if(await api.settings.value('video','cache')!==150)throw Error('setting');let rejected=false;try{await api.settings.setValue('video','cache','wrong')}catch(_){rejected=true}if(!rejected)throw Error('type');status.textContent='桥接校验通过'}catch(e){status.textContent='失败 '+e.message}})();
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function until(check,timeout=12000){const end=Date.now()+timeout;while(Date.now()<end){if(await check())return;await sleep(150)}throw Error('等待播放状态超时')}
async function playback(){let playing=0,lastError='';const played=()=>playing++,failed=e=>lastError=e;api.player.playing.connect(played);api.player.error.connect(failed);try{for(let n=0;n<20;n++){const before=playing;await api.player.load(location.origin+'/fixture.mp4',{autoplay:true,startMilliseconds:0},{type:'video',title:'受控播放夹具',metadata:{Name:'受控播放夹具',Id:'fixture'}},1,-1);await until(()=>playing>before||lastError);if(lastError)throw Error(lastError);const target=(2+n%6)*1000;await api.player.seekTo(target);await until(async()=>Math.abs((await api.player.getPosition())-target)<650);await api.player.pause();await api.player.play();await api.player.stop();}status.textContent='20 次播放和定位通过'}catch(e){await api.player.stop();status.textContent='播放失败 '+e.message}finally{api.player.playing.disconnect(played);api.player.error.disconnect(failed)}}
async function download(){try{const id=await api.system.startDownload({url:location.origin+'/fixture.mp4',title:'离线夹具',fileName:'fixture.mp4',itemId:'fixture'});await until(async()=>{const info=await api.system.downloadInfo(id);if(info.status==='error')throw Error(info.error);return info.status==='completed'},30000);status.textContent='下载完成并校验通过'}catch(e){status.textContent='下载失败 '+e.message}}
</script></body></html>
