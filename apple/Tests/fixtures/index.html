<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>iPad 受控验收</title></head><body style="background:#101218;color:white;font:22px system-ui;padding:32px">
<h1>受控 Emby 页面夹具</h1><p id="status">等待原生桥接</p><button id="play" style="font:inherit;padding:20px" onclick="playback()">验证播放循环</button><button style="font:inherit;padding:20px" onclick="download()">验证离线下载</button><button style="font:inherit;padding:20px" onclick="window.tigerestOpenOfflineLibrary()">打开离线媒体</button><button style="font:inherit;padding:20px" onclick="verifyQueue()">验证选集</button><button style="font:inherit;padding:20px" onclick="verifySubtitles()">验证字幕设置</button><button style="font:inherit;padding:20px" onclick="verifyVolume()">验证音量保留</button><button style="font:inherit;padding:20px" onclick="startGestures()">验证播放手势</button><a href="http://localhost:18768/foreign.html">外站跳转</a>
<button style="font:inherit;padding:20px" onclick="verifyAssets()">验证首页资源</button><button style="font:inherit;padding:20px" onclick="verifyQuality()">验证主设置画质</button><button style="font:inherit;padding:20px" onclick="verifyDanmaku()">验证弹幕</button><button style="font:inherit;padding:20px" onclick="verifyTransition()">验证返回转场</button>
<script>
let api;const status=document.querySelector('#status');
(async()=>{try{api=await window.apiPromise;if(!window.tigerestIPadApi||jmpInfo.platform!=='ipad')throw Error('missing platform');await api.settings.setValue('video','cache',150);if(await api.settings.value('video','cache')!==150)throw Error('setting');let rejected=false;try{await api.settings.setValue('video','cache','wrong')}catch(_){rejected=true}if(!rejected)throw Error('type');status.textContent='桥接校验通过'}catch(e){status.textContent='失败 '+e.message}})();
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function until(check,timeout=12000){const end=Date.now()+timeout;while(Date.now()<end){if(await check())return;await sleep(150)}throw Error('等待播放状态超时')}
async function playback(){let playing=0,lastError='';const played=()=>playing++,failed=e=>lastError=e;api.player.playing.connect(played);api.player.error.connect(failed);try{for(let n=0;n<20;n++){const before=playing;const normalize=n%2===0;await api.settings.setValue('audio','normalize',normalize);await api.player.load(location.origin+'/fixture.mp4',{autoplay:true,startMilliseconds:0},{type:'video',title:'受控播放夹具',metadata:{Name:'受控播放夹具',Id:'fixture'}},1,-1);await until(()=>playing>before||lastError);if(lastError)throw Error(lastError);await until(async()=>{const output=(await api.player.mpvDiagnostics()).audioOutput;return output&&output.driver&&output.sampleRate===48000&&output.normalizeDownmix===normalize});const target=(2+n%6)*1000;await api.player.seekTo(target);await until(async()=>Math.abs((await api.player.getPosition())-target)<650);await api.player.pause();await api.player.play();await api.player.stop();}status.textContent='20 次播放和定位通过'}catch(e){await api.player.stop();status.textContent='播放失败 '+e.message}finally{api.player.playing.disconnect(played);api.player.error.disconnect(failed)}}
async function download(){try{const id=await api.system.startDownload({url:location.origin+'/fixture.mp4',title:'离线夹具',fileName:'fixture.mp4',itemId:'fixture'});await until(async()=>{const info=await api.system.downloadInfo(id);if(info.status==='error')throw Error(info.error);return info.status==='completed'},30000);status.textContent='下载完成并校验通过'}catch(e){status.textContent='下载失败 '+e.message}}
async function verifyQueue(){try{await api.player.setWebPlaylist([{PlaylistItemId:'queue-first',Id:'same-media',Name:'第一项'},{PlaylistItemId:'queue-repeat',Id:'same-media',Name:'重复媒体第二项'}],'queue-first');const selected=async id=>{api.input.playlistItemRequested.disconnect(selected);await api.player.stop();status.textContent=id==='queue-repeat'?'选集身份校验通过':'选集身份错误'};api.input.playlistItemRequested.connect(selected);await api.player.load(location.origin+'/fixture.mp4',{autoplay:false,startMilliseconds:1000},{type:'video',title:'队列测试',metadata:{Id:'same-media'}},1,-1)}catch(e){status.textContent='队列失败 '+e.message}}
async function verifySubtitles(){try{await api.player.load(location.origin+'/fixture.mp4',{autoplay:false},{type:'video',title:'字幕设置测试'},1,-1);const baseline=(await api.player.mpvDiagnostics()).subtitleSettings;await api.settings.setValue('subtitles','size',42);await api.settings.setValue('subtitles','border_size',0);await api.settings.setValue('subtitles','placement','right,top');const current=(await api.player.mpvDiagnostics()).subtitleSettings;if(!current||Math.abs(Number(current['sub-scale'])-42/32)>0.001||Number(current['sub-border-size'])!==0||current['sub-align-x']!=='right'||Number(current['sub-pos'])!==10)throw Error('原生字幕设置未生效');await api.settings.resetToDefault('subtitles');const restored=(await api.player.mpvDiagnostics()).subtitleSettings;for(const name of ['sub-scale','sub-border-size','sub-align-x','sub-pos'])if(restored[name]!==baseline[name])throw Error('恢复默认未生效 '+name);await api.player.stop();status.textContent='字幕设置校验通过'}catch(e){await api.player.stop();status.textContent='字幕设置失败 '+e.message}}
async function verifyVolume(){try{await api.player.setVolume(23);await api.player.setMuted(true);if(await api.player.volume()!==23||!await api.player.muted())throw Error('播放前的音量或静音丢失');const load=()=>api.player.load(location.origin+'/fixture.mp4',{autoplay:false},{type:'video',title:'音量保留测试'},1,-1);await load();if(await api.player.volume()!==23||!await api.player.muted())throw Error('首次播放未恢复音量');await api.player.setVolume(47);await api.player.setMuted(false);await api.player.stop();await load();if(await api.player.volume()!==47||await api.player.muted())throw Error('换集后音量或静音丢失');await api.player.setVolume(0);await api.player.stop();await load();if(await api.player.volume()!==0)throw Error('主动静音未保留');await api.player.stop();status.textContent='音量保留校验通过'}catch(e){await api.player.stop();status.textContent='音量保留失败 '+e.message}}
async function startGestures(){
  const rates=[];let baseline=null,maxBrightness=0,lastPosition=0;
  const rate=v=>rates.push(v);api.player.playbackRateChanged.connect(rate);
  const poll=setInterval(async()=>{const d=await api.player.mpvDiagnostics();if(baseline!==null)maxBrightness=Math.max(maxBrightness,Math.abs(d.brightness-baseline));lastPosition=await api.player.getPosition()},100);
  const stopped=async()=>{clearInterval(poll);api.player.stopped.disconnect(stopped);api.player.playbackRateChanged.disconnect(rate);const restored=(await api.player.mpvDiagnostics()).brightness;
    status.textContent=rates.includes(2)&&rates.at(-1)===1?'长按倍速及恢复通过':lastPosition>2500&&lastPosition<3500&&maxBrightness>.1&&Math.abs(restored-baseline)<.03?'滑动定位与亮度恢复通过':'手势未通过 '+JSON.stringify({rates,lastPosition,maxBrightness,baseline,restored});
  };
  api.player.stopped.connect(stopped);
  await api.player.load(location.origin+'/fixture.mp4',{autoplay:false},{type:'video',title:'手势测试'},1,-1);
  await until(async()=>await api.player.getDuration()>10000);
  baseline=(await api.player.mpvDiagnostics()).brightness;status.textContent='手势夹具就绪';
}

async function verifyAssets(){try{await Promise.all(['anime','movies','series','favorites'].map(name=>new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>img.naturalWidth>100?resolve():reject(Error('尺寸异常'));img.onerror=()=>reject(Error(name+'图片失败'));img.src='tigerest://bundle/home-art/'+name+'.png'})));status.textContent='四张首页图片加载通过'}catch(e){status.textContent='首页图片失败 '+e.message}}
async function verifyQuality(){try{const setting=jmpInfo.settingsDescriptions.mpv.find(x=>x.key==='shaderPreset');if(!setting||setting.options.length!==4)throw Error('主设置缺少选项');await api.settings.setValue('mpv','shaderPreset','liveaction');if((await api.player.mpvDiagnostics()).qualityPreset!=='tigerest-liveaction')throw Error('选择未应用');await api.settings.resetToDefault('mpv');if((await api.player.mpvDiagnostics()).qualityPreset!=='native')throw Error('恢复无效');status.textContent='主设置画质校验通过'}catch(e){status.textContent='主设置画质失败 '+e.message}}
async function verifyDanmaku(){try{await api.settings.setValue('danmaku','apiServer',location.origin);await api.settings.setValue('mpv','enableDanmaku',false);await api.player.load(location.origin+'/fixture.mp4',{autoplay:false,startMilliseconds:4000},{type:'video',title:'弹幕验收',metadata:{Id:'danmaku-fixture',SeriesName:'弹幕验收作品',ParentIndexNumber:'1',IndexNumber:'1',Name:'开始'}},1,-1);await api.danmaku.setEnabled(true);await until(async()=>{const sources=await api.danmaku.sources();return sources.length===1&&sources[0].count===3});await api.danmaku.setSource(location.origin+'/1230001',false,1.5);let sources=await api.danmaku.sources();if(sources[0].enabled||sources[0].delay!==1.5)throw Error('来源设置无效');await api.danmaku.setSource(location.origin+'/1230001',true,0);status.textContent='弹幕匹配开关与偏移通过'}catch(e){await api.player.stop();status.textContent='弹幕失败 '+e.message}}
async function verifyTransition(){
 try{
 const before=document.createElement('div');before.className='page view-item-item';before.style.cssText='position:fixed;inset:0;background:linear-gradient(120deg,#506ca0,#603830);z-index:9;color:white;padding:40px';
 before.innerHTML='<h1>详情背景</h1><img id="motion-source" src="tigerest://bundle/home-art/anime.png" style="width:200px;height:280px;object-fit:cover"><p>完整分辨率毛玻璃场景</p>';
 document.body.append(before);await before.querySelector('img').decode();await TigerestHomeTransitions.prewarm();
 const after=before.cloneNode(true);after.style.background='linear-gradient(120deg,#205a45,#34456a)';after.querySelector('h1').textContent='海报墙背景';const target=after.querySelector('img');target.id='motion-target';target.style.cssText+=';width:100px;height:140px;margin-left:280px;margin-top:200px';
 await TigerestHomeTransitions.poster({source:before.querySelector('img'),direction:'return',navigate:async()=>{before.classList.add('hide');before.style.display='none';document.body.append(after)},findTarget:()=>target});
 const result=TigerestHomeTransitions.last;before.remove();after.remove();
 if(result.backgroundRenderer!=='dom-glass'||result.surfaces.length||result.landingErrorPx>2||document.querySelector('.tigerest-motion-layer,.tigerest-motion-poster'))throw Error(JSON.stringify(result));
 status.textContent='返回转场全分辨率与清理通过';
 }catch(e){status.textContent='转场失败 '+e.message}
}
</script></body></html>
