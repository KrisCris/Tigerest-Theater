name: build

# Every push builds every shipped platform and keeps the packages as run
# artifacts. Release publishing stays in publish-release.yml.
on:
  push:
    branches:
      - '**'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    uses: ./.github/workflows/build-macos.yml

  windows:
    permissions:
      contents: write
    uses: ./.github/workflows/build-windows.yml

  android:
    uses: ./.github/workflows/build-android.yml

  ipad:
    # Waits for the compiled RIFE model from the macOS arm64 job, which is
    # archived before that job's unit tests run.
    needs: macos
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/build-ipad.yml

  tvos:
    uses: ./.github/workflows/build-tvos.yml
