name: build-rife-mpv

on:
  workflow_dispatch:
  push:
    branches: [codex/windows-rife-trt]
    paths:
      - .github/workflows/build-rife-mpv.yml
      - dev/windows/rife/build_mpv.py
      - dev/windows/rife/freeze_mpv_sources.py
      - dev/windows/rife/mpv-private-vs-core.patch
      - dev/windows/rife/prepare_mpv_recipe.py
      - dev/macos/rife/mpv-eof-aware.patch

permissions:
  contents: read

jobs:
  freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Fetch original build recipe
        run: |
          git clone https://github.com/shinchiro/mpv-winbuild-cmake.git recipe
          git -C recipe checkout cd1edc11dc6887a50f705717619d879f5a93a488
      - name: Freeze Git dependencies at original build date
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 dev/windows/rife/freeze_mpv_sources.py --recipe recipe --output source-lock.json
      - uses: actions/upload-artifact@v4
        with:
          name: rife-mpv-source-lock
          path: source-lock.json

  build:
    needs: freeze
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GIT_COMMITTER_NAME: Tigerest mpv build
      GIT_COMMITTER_EMAIL: mpv-build@tigerest.invalid
    strategy:
      fail-fast: false
      matrix:
        arch: [x86-64, x86-64-v3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: rife-mpv-source-lock
      - name: Prepare compiler build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bison flex gettext mercurial subversion ninja-build gyp cmake yasm nasm automake pkgconf libtool libtool-bin gcc-multilib g++-multilib clang lld libc++1 libc++abi1 libgmp-dev libmpfr-dev libmpc-dev libgcrypt-dev gperf ragel texinfo autopoint re2c asciidoc docbook2x unzip p7zip-full curl libmimalloc-dev ccache python3-venv
          python3 -m venv tools
          tools/bin/pip install meson==1.11.2 mako==1.3.10 jsonschema==4.23.0 rst2pdf==0.103.1
          echo "$PWD/tools/bin" >> "$GITHUB_PATH"
      - name: Prepare pinned recipe and EOF patch
        run: |
          git clone https://github.com/shinchiro/mpv-winbuild-cmake.git recipe
          git -C recipe checkout cd1edc11dc6887a50f705717619d879f5a93a488
          python3 dev/windows/rife/prepare_mpv_recipe.py --recipe recipe --lock source-lock.json
      - uses: actions/cache@v4
        with:
          path: build-mpv
          key: rife-mpv-aug2026-${{ matrix.arch }}-${{ hashFiles('source-lock.json', 'dev/macos/rife/mpv-eof-aware.patch', 'dev/windows/rife/mpv-private-vs-core.patch', 'dev/windows/rife/prepare_mpv_recipe.py') }}
          restore-keys: |
            rife-toolchain-${{ matrix.arch }}-${{ hashFiles('source-lock.json', 'dev/windows/rife/prepare_mpv_recipe.py') }}
      - name: Build cross compiler
        run: |
          cmake -G Ninja -S recipe -B build-mpv -DTARGET_ARCH=x86_64-w64-mingw32 -DGCC_ARCH=${{ matrix.arch }} -DCOMPILER_TOOLCHAIN=gcc -DMAKEJOBS=4
          ninja -C build-mpv gcc
      - uses: actions/cache/save@v4
        with:
          path: build-mpv
          key: rife-toolchain-${{ matrix.arch }}-${{ hashFiles('source-lock.json', 'dev/windows/rife/prepare_mpv_recipe.py') }}
      - name: Build mpv and media dependencies
        run: |
          ninja -C build-mpv mpv
      - name: Record build provenance
        if: success()
        run: |
          mkdir artifacts
          find build-mpv -path '*/mpv-dev-*/libmpv-2.dll' -exec cp {} artifacts/ \;
          find build-mpv -path '*/mpv-dev-*/libmpv.dll.a' -exec cp {} artifacts/ \;
          test -s artifacts/libmpv-2.dll
          cp source-lock.json artifacts/
          sha256sum artifacts/libmpv-2.dll dev/macos/rife/mpv-eof-aware.patch dev/windows/rife/mpv-private-vs-core.patch > artifacts/SHA256SUMS.txt
          printf '%s\n' '${{ github.sha }}' > artifacts/host-source-sha.txt
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: rife-libmpv-${{ matrix.arch }}
          path: artifacts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: rife-libmpv-failure-${{ matrix.arch }}
          path: |
            build-mpv/**/src/*-stamp/*.log
            build-mpv/CMakeFiles/CMakeConfigureLog.yaml
            source-lock.json
