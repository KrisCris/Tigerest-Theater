name: test

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Install build dependencies from debian/control
      run: |
        sudo apt-get update
        sudo apt-get install --yes devscripts equivs ninja-build lcov xvfb xauth
        sudo mk-build-deps -i -r -t "apt-get --yes" debian/control
        # Build-Depends do not install the QML plugins used when launching tests.
        sudo apt-get install --yes \
          qml6-module-qtquick qml6-module-qtqml \
          qml6-module-qtwebengine qml6-module-qtwebchannel \
          qml6-module-qtquick-controls qml6-module-qtquick-dialogs \
          qml6-module-qtquick-window qml6-module-qtqml-workerscript \
          qml6-module-qtquick-templates qml6-module-qt-labs-platform

    - name: Configure
      run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DUSE_STATIC_MPVQT=ON -DCOVERAGE=ON

    - name: Build
      run: cmake --build build

    - name: Run tests
      run: |
        xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
          ctest --test-dir build --output-on-failure

    - name: Collect coverage
      run: |
        lcov --capture --directory build --output-file coverage.info \
          --ignore-errors mismatch
        lcov --remove coverage.info \
          '/usr/*' '*/external/*' '*/tests/*' '*/build/*' \
          --output-file coverage.info \
          --ignore-errors unused
        lcov --summary coverage.info 2>&1 | grep -v 'no data found' > coverage_summary.txt

    - name: Save PR number
      if: github.event_name == 'pull_request'
      run: echo "${{ github.event.pull_request.number }}" > pr_number.txt

    - name: Upload coverage artifact
      if: github.event_name == 'pull_request'
      uses: actions/upload-artifact@v7
      with:
        name: coverage
        path: |
          coverage_summary.txt
          pr_number.txt
